<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
        <!-- <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
        <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
        <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder> -->
        <!-- <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane> -->
      <!-- <a-sky color="#ECECEC"></a-sky> -->
        <a-assets>

            <img id="sky" src="images/sky_pastel_01_lowres.png">

            <img id="grass" src="images/tides_grass_a.png">
            <img id="sidewalk" src="images/tides_floor_stone_1.png">

            <img id="tree" src="images/tree.png">
            <img id="picnic" src="images/picnic.png">

            <img id="bench" src="images/bench.png">
            <img id="chips" src="images/chips.png">
            <img id="bush" src="images/bush.png">

            <img id="text" src="images/text.png">
            <img id="text2" src="images/text2.png">
            <img id="text3" src="images/text3.png">
            <img id="text4" src="images/text4.png">


            <img id="windows" src="images/concretewall013b_illum.png">
            <img id="wall" src="images/black_wall_metal_002b.png">
            <img id="wallheight" src="images/black_wall_metal_002b_height-ssbump.png">
            <img id="wallenvmap" src="images/black_wall_envmap_002a_hdr.png">

        </a-assets>

        <!-- light -->
        <a-light type="ambient" color="#ffcfe6"></a-light>
        <a-light intensity="3" position="-1.5 1 0"></a-light>

        <!-- sky environment -->
        <a-sky src="#sky"></a-sky>

        <!-- floor -->
        <a-plane src="#grass" position="0 0 0" rotation="-90 0 0" width="12" height="12" roughness="1.0" ></a-plane>
        <a-box src="#sidewalk" position="8 -0.25 0" depth="20" height="1" width="4" roughness="0.8" repeat="1 6"></a-box>
        <a-box src="#sidewalk" position="-8 -0.25 0" depth="20" height="1" width="4" roughness="0.8" repeat="1 6"></a-box>
        <a-box src="#sidewalk" position="0 -0.25 8" depth="4" height="1" width="12" roughness="0.8" repeat="4 1"></a-box>
        <a-box src="#sidewalk" position="0 -0.25 -8" depth="4" height="1" width="12" roughness="0.8" repeat="4 1"></a-box>


        <!-- static elements -->
        <a-plane src="#tree" position="-4 3 -4" rotation="0 15 0" width="8" height="8" roughness="1.0" transparent="1" side="double"></a-plane>
        <a-plane src="#tree" position="-4 3 -4" rotation="0 105 0" width="8" height="8" roughness="1.0" transparent="1" side="double"></a-plane>

        <a-plane src="#tree" position="4 3 4" rotation="0 0 0" width="8" height="8" roughness="1.0" transparent="1" side="double"></a-plane>
        <a-plane src="#tree" position="4 3 4" rotation="0 90 0" width="8" height="8" roughness="1.0" transparent="1" side="double"></a-plane>

        <a-plane src="#picnic" position="-2 0.5 -2" rotation="0 60 0" width="2" height="1" transparent="1"></a-plane>
     
        <a-plane src="#text4" position="20 35 -40" rotation="0 0 0" width="40" height="15" transparent="1" visible="true" side="double" roughness="1" animation="property: object3D.position.y; to: 36; dir: alternate; dur: 2000; loop: true"></a-plane>
        <a-plane src="#text4" position="20 35.5 -40" rotation="0 0 0" width="40" height="15" transparent="1" visible="true" side="double" roughness="1" animation="property: object3D.position.y; to: 36; dir: alternate; dur: 2000; loop: true"></a-plane>
        <a-plane src="#text4" position="20.5 37 -40" rotation="0 0 0" width="40" height="15" transparent="1" visible="true" side="double" roughness="1" animation="property: object3D.position.y; to: 36; dir: alternate; dur: 2000; loop: true"></a-plane>
        <a-plane src="#text4" position="20.5 36.5 -40" rotation="0 0 0" width="40" height="15" transparent="1" visible="true" side="double" roughness="1" animation="property: object3D.position.y; to: 36; dir: alternate; dur: 2000; loop: true"></a-plane>


        <!-- interactive elements -->
        <a-plane id="interactive1" src="#bench" position="-4 1 4" rotation="0 135 0" width="4" height="2" roughness="0.7" transparent="1"></a-plane>
        <a-plane id="toggle1" src="#text2" position="-4 3 4" rotation="0 135 0" width="4" height="1.5" transparent="1" visible="false" roughness="1" animation="property: object3D.position.y; to: 3.5; dir: alternate; dur: 2000; loop: true"></a-plane>

        <a-plane id="interactive2" src="#chips" position="-2 0.5 -1" rotation="0 60 0" width="1.5" height="0.8" transparent="1"></a-plane>
        <a-plane id="toggle2" src="#text" position="-2 2 -1" rotation="0 60 0" width="2" height="0.8" transparent="1" visible="false" roughness="1" animation="property: object3D.position.y; to: 1.5; dir: alternate; dur: 2000; loop: true"></a-plane>

        <a-plane id="interactive3" src="#bush" position="3.5 1 -3" rotation="0 290 0" width="6" height="4" transparent="1"></a-plane>
        <a-plane id="toggle3" src="#text3" position="3.25 3.3 -2.75" rotation="0 290 0" width="5.5" height="2" transparent="1" visible="false" roughness="1" animation="property: object3D.position.y; to: 3.5; dir: alternate; dur: 2000; loop: true"></a-plane>



        <!-- <a-box id="interactive" src="#wall" depth="4" height="4" width="4" position="-8 2 -16" rotation="0 0 0" env-map="#wallenvmap" roughness="0.25" metalness="1" metalness-map="#wallheight" animation="property: object3D.position.y; to: 2.2; dir: alternate; dur: 2000; loop: true"></a-box> -->


        <a-camera>
          <a-cursor color="#FAFAFA"></a-cursor>
        </a-camera>

    </a-scene>

    <script src="js/box.js"></script>

  </body>
</html>
