<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>

        <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>

      <!-- <a-sky color="#ECECEC"></a-sky> -->
        <a-assets>

            <img id="sky" src="images/sky_pastel_01.jpg">
            <img id="windows" src="images/concretewall013b_illum.png">
            <img id="computer" src="images/computer.jpg">
            <img id="background-1" src="images/background_oak.jpg">
            <img id="wall" src="images/black_wall_metal_002b.png">
            <img id="wallheight" src="images/black_wall_metal_002b_height-ssbump.png">
            <img id="wallenvmap" src="images/black_wall_envmap_002a_hdr.png">

        </a-assets>
        <a-sky src="#sky"></a-sky>

        <a-plane src="#windows" position="0 0 0" rotation="-90 0 0" width="16" height="16" roughness="0.75" ></a-plane>

        <a-box src="#wall" depth="4" height="4" width="4" position="-8 2 -4" rotation="0 0 0" env-map="#wallenvmap" roughness="0.25" metalness="1" metalness-map="#wallheight"></a-box>

        <a-box src="#wall" depth="4" height="4" width="4" position="-1 2 -4" rotation="0 0 0" env-map="#wallenvmap" roughness="0.25" metalness="1" metalness-map="#wallheight"></a-box>

        <a-box src="#wall" depth="4" height="4" width="4" position="-6 2 1" rotation="45 45 0" env-map="#wallenvmap" roughness="0.25" metalness="1" metalness-map="#wallheight"></a-box>

        <a-box src="#computer" depth="4" height="8" width="8" position="8 0 8" rotation="0 45 0"></a-box>

        <a-box src="#background-1" depth="16" height="16" width="8" position="16 8 -16" rotation="0 34 0"></a-box>
        <a-box src="#background-1" depth="16" height="16" width="8" position="-10 24 -20" rotation="0 45 0"></a-box>
        <a-box src="#background-1" depth="16" height="16" width="8" position="20 8 -8" rotation="0 57 0"></a-box>


    </a-scene>
